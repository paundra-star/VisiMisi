<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visi & Misi Paundra</title>
  <style>
    /* ========== GLOBAL STYLE ========== */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at center, #0d0d0d 0%, #050505 100%);
      color: white;
      overflow: hidden;
    }

    /* Background corak neon */
    .pattern {
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-radial-gradient(
        circle at center,
        rgba(0, 255, 255, 0.05),
        rgba(0, 0, 0, 0.05) 100px
      );
      animation: rotatePattern 40s linear infinite;
      z-index: 0;
    }

    @keyframes rotatePattern {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* HEADER TEKS DI TENGAH ATAS */
    header {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
    }

    header h2 {
      font-size: 3rem;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff;
      animation: glowText 2s infinite alternate;
    }

    @keyframes glowText {
      from { text-shadow: 0 0 10px #00ffff; }
      to { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
    }

    /* Container utama */
    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 0 10%;
      position: relative;
      z-index: 1;
    }

    .text-box {
      width: 45%;
      position: relative;
    }

    .text-box h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #00ffff;
    }

    .text-box p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .image-box {
      width: 45%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-box img {
      width: 100%;
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
      transition: transform 1s ease, opacity 1s ease;
    }

    /* Tombol navigasi */
    .nav-buttons {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 2;
    }

    .nav-buttons button {
      background: none;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }

    .nav-buttons button:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 20px #00ffff;
    }

    /* Animasi split merge */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: #00ffff;
      transform: translateX(-100%);
      z-index: 10;
    }

    .overlay.right {
      left: 50%;
      background: #00ffff;
      transform: translateX(100%);
    }

    .overlay.active-left {
      animation: slideLeft 0.5s forwards;
    }

    .overlay.active-right {
      animation: slideRight 0.5s forwards;
    }

    @keyframes slideLeft {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    @keyframes slideRight {
      0% { transform: translateX(100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="pattern"></div>

  <!-- Teks Header Tengah Atas -->
  <header>
    <h2>VISI & MISI</h2>
  </header>

  <!-- Efek animasi split -->
  <div class="overlay"></div>
  <div class="overlay right"></div>

  <!-- Isi utama -->
  <div class="container">
    <div class="text-box">
      <h1 id="title">Visi</h1>
      <p id="description">
        Menjadikan NITC sebagai wadah pengembangan kreativitas dan keterampilan di bidang digital untuk membentuk siswa yang inovatif dan siap bersaing di era global.
      </p>
    </div>
    <div class="image-box">
      <img id="image" src="draa.jpg" alt="Visi" />
    </div>
  </div>

  <!-- Navigasi -->
  <div class="nav-buttons">
    <button onclick="showPage(0)">Visi</button>
    <button onclick="showPage(1)">Misi 1</button>
    <button onclick="showPage(2)">Misi 2</button>
  </div>

  <script>
    const pages = [
      {
        title: "Visi",
        description:
          "Menjadikan NITC sebagai wadah pengembangan kreativitas dan keterampilan di bidang digital untuk membentuk siswa yang inovatif dan siap bersaing di era global.",
        image: "draa.jpg"
      },
      {
        title: "Misi 1",
        description:
          "Mengembangkan kemampuan siswa di bidang digital melalui pelatihan dan praktik nyata yang relevan.",
        image: "misi1.jpg"
      },
      {
        title: "Misi 2",
        description:
          "Menumbuhkan budaya kolaborasi, inovatif dan pemecahan masalah untuk menciptakan karya bermanfaat bagi sekolah dan masyarakat.",
        image: "misi2.jpg"
      }
    ];

    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("description");
    const imgEl = document.getElementById("image");
    const overlays = document.querySelectorAll(".overlay");

    let isAnimating = false;

    function showPage(index) {
      if (isAnimating) return;
      isAnimating = true;

      // Jalankan animasi split
      overlays[0].classList.add("active-left");
      overlays[1].classList.add("active-right");

      setTimeout(() => {
        const page = pages[index];
        titleEl.textContent = page.title;
        descEl.textContent = page.description;

        imgEl.style.opacity = 0;
        setTimeout(() => {
          imgEl.src = page.image;
          imgEl.style.opacity = 1;
        }, 300);

        overlays[0].classList.remove("active-left");
        overlays[1].classList.remove("active-right");
        isAnimating = false;
      }, 500);
    }
  </script>
</body>
</html>
